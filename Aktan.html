  <style>
    * {
  box-sizing: border-box;
  margin: 0;

body {
  font-family: Arial, sans-serif;
  color: #222;
  background: #f5f5f5;
}

h1{
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top:30px;
    font-size: 50px;

}

header {
  background: #111;
  color: #fff;
  padding: 16px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

nav {
  display: flex;
  gap: 24px;
}

nav a {
  color: #fff;
  text-decoration: none;
  font-size: 18px;
}

nav a:hover {
  color: #f5b301;
}

.hero {
  background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), #333;
  color: #fff;
  text-align: center;
  padding: 100px 20px;
}

.hero h2 {
  font-size: 48px;
  margin-bottom: 12px;
}

.hero p {
  font-size: 20px;
  margin-bottom: 24px;
}

.btn {
  display: inline-block;
  background: #f5b301;
  color: #000;
  padding: 12px 28px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

.btn:hover {
  background: #d99f00;
}

.cards {
  max-width: 1100px;
  margin: 40px auto;
  display: flex;
  gap: 20px;
  padding: 0 20px;
}

.card {
  flex: 1;
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
  padding-bottom: 16px;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  background: #ddd;
}

.card h3 {
  margin: 14px 16px 6px;
}

.card p {
  margin: 0 16px;
  color: #555;
}

footer {
  background: #111;
  color: #aaa;
  text-align: center;
  padding: 20px;
}
